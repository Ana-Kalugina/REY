name: REY
options:
  bundleIdPrefix: com.anakalugina
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  REY:
    type: application
    platform: iOS
    sources:
      - path: REY
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anakalugina.rey
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: REY/Info.plist
        DEVELOPMENT_ASSET_PATHS: "\"REY/Preview Content\""
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: SpriteKit.framework
      - sdk: GameplayKit.framework
